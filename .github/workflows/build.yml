name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 17 SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          $SDKM --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u
          yes | $SDKM "platforms;android-37" > /dev/null || yes | $SDKM "platforms;android-37.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Get the AI engine (llama.cpp)
        run: git clone --depth 1 --branch "$(cat LLAMA_CPP_VERSION)" https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Lucifer-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lucifer-apk
          path: Lucifer-*.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lucifer v${{ github.run_number }}
          body: Download the .apk below on your phone and open it to install or update.
          files: Lucifer-*.apk
          make_latest: true
