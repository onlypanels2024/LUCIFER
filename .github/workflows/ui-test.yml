name: Virtual phone test

on:
  push:
    branches: [ui-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 17 SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          $SDKM --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u
          yes | $SDKM "platforms;android-37" > /dev/null || yes | $SDKM "platforms;android-37.0" > /dev/null
          ls "$ANDROID_HOME/platforms" | tee sdk-platforms.txt

      - name: Get the AI engine (llama.cpp)
        run: git clone --depth 1 --branch "$(cat LLAMA_CPP_VERSION)" https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build test app
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Check the suggested model download links
        run: |
          mkdir -p ui-results
          for u in $(grep -o 'https://huggingface.co/[^"]*\.gguf' app/src/main/java/com/onlypanels/lucifer/ModelFiles.java); do
            echo "$(curl -sIL -o /dev/null -w '%{http_code}' "$u") $(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r') $u" | tee -a ui-results/model-links.txt
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          cores: 4
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/uitest/run.sh

      - name: Save results to branch ui-results
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r ui-results/. /tmp/r/ 2>/dev/null || true
          tail -200 build-log.txt > /tmp/r/build-log-tail.txt 2>/dev/null || true
          cp sdk-platforms.txt /tmp/r/ 2>/dev/null || true
          git config user.name "ui-test"
          git config user.email "ui-test@users.noreply.github.com"
          git checkout --orphan ui-results
          git rm -rfq . || true
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/r/. .
          echo "run ${{ github.run_number }} ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "UI test results run ${{ github.run_number }}"
          git push -f origin ui-results
